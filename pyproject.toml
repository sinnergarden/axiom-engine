[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-engine"
version = "0.3.2"
requires-python = ">=3.11"
description = "Deterministic Core features and offline cached-signal account backtests"
dependencies = []

[project.optional-dependencies]
forward-returns = ["numpy"]
feature-columns = ["numpy"]
feature-library = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
